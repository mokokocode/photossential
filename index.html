/* Neobrutalism palette: yellow fills primary action blocks, violet carries
   secondary/link/focus states, navy does double duty as both body text and
   every structural border. Kept as a light theme (the skill's tokens are
   built around an off-white surface) -- see the comment on .canvas-wrap
   below for why the photo mat itself stays a neutral gray regardless. */
:root {
  color-scheme: light;
  --bg: #fbfbf9;
  --panel: #ffffff;
  --panel-2: #ffffff;
  --text: #1c293c;
  --muted: #5b6472;
  --accent: #fdc800;
  --accent-ink: #1c293c;
  --secondary: #432dd7;
  --success: #16a34a;
  --warning: #d97706;
  --danger: #dc2626;
  --border: #1c293c;
  --shadow-sm: 2px 2px 0px var(--border);
  --shadow-sm-hover: 4px 4px 0px var(--border);
  --shadow-md: 3px 3px 0px var(--border);

  <script>
(() => {
  "use strict";

  const fileInput = document.getElementById("file-input");
  const dropZone = document.getElementById("drop-zone");
  const editor = document.getElementById("editor");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const canvasWrap = document.getElementById("canvas-wrap");
  const compareBtn = document.getElementById("compare-btn");
  const undoBtn = document.getElementById("undo-btn");
  const redoBtn = document.getElementById("redo-btn");
  const zoomInBtn = document.getElementById("zoom-in-btn");
  const zoomOutBtn = document.getElementById("zoom-out-btn");

  const aspectSelect = document.getElementById("aspect-ratio");
  const cropBtn = document.getElementById("crop-btn");
  const cropRemoveBtn = document.getElementById("crop-remove-btn");
  const cropRatioSelect = document.getElementById("crop-ratio-select");
  const cropDoneBtn = document.getElementById("crop-done-btn");
  const canvasToolbarLeft = document.getElementById("canvas-toolbar-left");
  const transformRow = document.getElementById("transform-row");
  const widthSlider = document.getElementById("border-width");
  const widthValue = document.getElementById("border-width-value");
  const colorInput = document.getElementById("border-color");
  const swatches = document.getElementById("swatches");
  const styleSelect = document.getElementById("border-style");
  const radiusSlider = document.getElementById("corner-radius");
  const radiusValue = document.getElementById("corner-radius-value");
  const downloadBtn = document.getElementById("download-btn");
  const resetBtn = document.getElementById("reset-btn");
  const maxSizeToggle = document.getElementById("max-size-toggle");
  const maxSizeValue = document.getElementById("max-size-value");
  const maxSizeUnit = document.getElementById("max-size-unit");
  const statusLine = document.getElementById("status-line");

  const brightnessSlider = document.getElementById("brightness");
  const brightnessValue = document.getElementById("brightness-value");
  const saturationSlider = document.getElementById("saturation");
  const saturationValue = document.getElementById("saturation-value");
  const curveSlider = document.getElementById("s-curve");
  const curveValue = document.getElementById("s-curve-value");

  const rotateBtn = document.getElementById("rotate-btn");
  const flipHBtn = document.getElementById("flip-h-btn");
  const flipVBtn = document.getElementById("flip-v-btn");
  const fineRotateSlider = document.getElementById("fine-rotate");
  const fineRotateValue = document.getElementById("fine-rotate-value");
  const levelLineBtn = document.getElementById("level-line-btn");
  const levelLineHint = document.getElementById("level-line-hint");
  const resetEditsBtn = document.getElementById("reset-edits-btn");
  const autoWbToggle = document.getElementById("auto-wb");

  let currentImage = null;
  let currentFileBaseName = "photo";

  // Cache of the photo with brightness/saturation/S-curve baked in, so those
  // (relatively expensive, per-pixel) adjustments are only recomputed when
  // they actually change -- not on every render triggered by an unrelated
  // control like border width or color.
  let adjustedPhotoCanvas = null;
  let adjustedPhotoKey = null;

  // Auto white balance gains, computed once per photo (they only depend on
  // the photo's own colors, not on any slider), then reused every render.
  let whiteBalanceGains = null;

  // Rotate/flip: a per-photo geometric fix (sideways import, mirrored
  // selfie), so -- like crop pan/zoom and the brightness/vivid/S-curve
  // sliders -- it resets on a new photo rather than being remembered as a
  // standing preference. rotation is in degrees, always one of 0/90/180/270.
  let rotation = 0;
  let flipH = false;
  let flipV = false;

  // Straighten: a fine, continuous rotation (in degrees, -45..45) on top of
  // the 90-degree Rotate button -- for leveling a slightly crooked horizon
  // rather than a full quarter-turn. Unlike rotation/flip, this doesn't
  // remap pixel coordinates (see getFineRotatedSource below, which always
  // outputs the same width/height it was given), so an active crop rect
  // stays valid and simply previews the newly-tilted content live -- no
  // need to clear it the way a 90-degree rotate or flip does.
  let fineRotation = 0;

  // Shown while adjusting Straighten (see the "focus"/"blur" listeners on
  // fineRotateSlider below) so tilt is easy to judge against something
  // screen-aligned, and also while the Level-line tool is active (see
  // levelLineActive below), since that's the same judgment call.
  let straightenGridFocused = false;
  function isStraightenGridVisible() {
    return straightenGridFocused || levelLineActive;
  }

  // The Level-line tool: draw a line along anything in the photo that
  // should read as level or plumb (a wall edge, a horizon, a shelf) and
  // Straighten snaps to match it -- far more precise than eyeballing the
  // slider, which matters most on exactly the kind of architectural/
  // construction photos where a few degrees of tilt is easy to miss by eye.
  // levelLineStart/Current are in canvas-pixel space (see
  // canvasPointToPixel) while a drag is in progress; both null when idle.
  let levelLineActive = false;
  let levelLineStart = null;
  let levelLineCurrent = null;

  // Preview zoom: purely a way to inspect detail on screen -- it resizes
  // the on-screen canvas element via CSS, never the actual image data, so
  // it has no effect on the download. previewBaseW/H cache the canvas's
  // normal (un-zoomed) on-screen size the first time zoom is used, since
  // that's needed to compute the zoomed pixel size but can't be re-measured
  // once the canvas is already zoomed. Invalidated whenever the photo's
  // actual rendered size changes (see render()), since a stale base size
  // would zoom to the wrong dimensions.
  let previewZoom = 1;
  let previewBaseW = null;
  let previewBaseH = null;
  let lastLayoutW = null;
  let lastLayoutH = null;

  function applyPreviewZoom() {
    if (previewZoom <= 1) {
      canvas.style.width = "";
      canvas.style.height = "";
      canvas.classList.remove("zoomed-preview");
      canvasWrap.classList.remove("zoomed");
    } else {
      if (previewBaseW === null) {
        const rect = canvas.getBoundingClientRect();
        previewBaseW = rect.width;
        previewBaseH = rect.height;
      }
      canvas.classList.add("zoomed-preview");
      canvasWrap.classList.add("zoomed");
      canvas.style.width = `${Math.round(previewBaseW * previewZoom)}px`;
      canvas.style.height = `${Math.round(previewBaseH * previewZoom)}px`;
    }
    zoomOutBtn.disabled = previewZoom <= 1;
  }

  function resetPreviewZoom() {
    previewZoom = 1;
    previewBaseW = null;
    previewBaseH = null;
    applyPreviewZoom();
  }

  zoomInBtn.addEventListener("click", () => {
    previewZoom = Math.min(3, previewZoom + 0.5);
    applyPreviewZoom();
  });
  zoomOutBtn.addEventListener("click", () => {
    previewZoom = Math.max(1, previewZoom - 0.5);
    applyPreviewZoom();
  });

  // Pinch-to-zoom: the same preview-only zoom as the +/- buttons above,
  // driven by a two-finger pinch directly on the photo instead. Disabled
  // during crop-adjust, which uses its own touch dragging on the crop box
  // handles and would conflict with a second finger. Raw touch events (not
  // the Pointer Events used for crop/compare dragging below) since tracking
  // two simultaneous contacts and their distance is what a pinch needs.
  let pinchActive = false;
  let pinchStartDist = 0;
  let pinchStartZoom = 1;

  function touchDistance(touches) {
    return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
  }

  canvasWrap.addEventListener(
    "touchstart",
    (e) => {
      if (cropAdjusting || levelLineActive || e.touches.length !== 2) return;
      pinchActive = true;
      pinchStartDist = touchDistance(e.touches);
      pinchStartZoom = previewZoom;
      e.preventDefault();
    },
    { passive: false }
  );

  canvasWrap.addEventListener(
    "touchmove",
    (e) => {
      if (!pinchActive || e.touches.length !== 2) return;
      if (pinchStartDist > 0) {
        previewZoom = Math.min(3, Math.max(1, pinchStartZoom * (touchDistance(e.touches) / pinchStartDist)));
        applyPreviewZoom();
      }
      e.preventDefault();
    },
    { passive: false }
  );

  function endPinch() {
    pinchActive = false;
  }
  canvasWrap.addEventListener("touchend", endPinch);
  canvasWrap.addEventListener("touchcancel", endPinch);

  // Crop: an optional rectangle, in the ROTATED/flipped photo's own pixel
  // space (see getRotatedFullCanvas below), that cuts the photo down before
  // it's placed on the border. null means "use the whole photo" (the
  // existing pad-never-crop behavior). Like rotation/flip and the
  // brightness/vivid/S-curve sliders, this is a per-photo choice -- it
  // resets on a new photo and is never saved as a standing preference.
  // Rotating or flipping the photo also clears it, since remapping a pixel
  // rectangle across an orientation change isn't worth the complexity.
  let cropRect = null; // {x, y, w, h} or null
  let cropAdjusting = false;
  let cropDragMode = null; // "move" | "nw" | "ne" | "sw" | "se" | null
  let cropDragStart = null;
  // Captured when entering crop-adjust, so Done can tell "the user opened
  // the tool and left without touching the (now inset-by-default) box"
  // apart from "the user actually chose this crop" -- see exitCropAdjust.
  let cropHadExistingOnEntry = false;
  let cropRectAtEntry = null;
  // Set whenever the ratio dropdown is changed during this crop-adjust
  // session. Needed because picking a ratio that happens to match the
  // default box's own shape (e.g. "1:1" on an already-square photo) leaves
  // the rect's coordinates identical to cropRectAtEntry -- without this
  // flag that would look indistinguishable from "opened Crop and left
  // without touching anything" and get discarded below.
  let cropRatioChangedDuringAdjust = false;

  // The full current photo, rotated/flipped once and cached -- both the
  // crop tool and the final render crop out of this same canvas, so a crop
  // rectangle always means exactly what's on screen while adjusting it.
  let rotatedFullCanvas = null;
  let rotatedFullKey = null;

  // Straighten's own cache: the original photo tilted by fineRotation and
  // zoomed just enough to still fully cover its own original frame -- same
  // width/height as the source, no blank corners. Kept separate from
  // rotatedFullCanvas above since it feeds INTO that step (see
  // getRotatedFullCanvas), rather than replacing it.
  let fineRotatedSourceCanvas = null;
  let fineRotatedSourceKey = null;

  function getFineRotatedSource() {
    if (!fineRotation) return currentImage;
    const iw = currentImage.naturalWidth;
    const ih = currentImage.naturalHeight;
    const key = `${iw}x${ih}|${fineRotation}`;
    if (fineRotatedSourceCanvas && fineRotatedSourceKey === key) return fineRotatedSourceCanvas;

    const theta = (fineRotation * Math.PI) / 180;
    const cos = Math.abs(Math.cos(theta));
    const sin = Math.abs(Math.sin(theta));
    // The classic "rotate without revealing empty corners" zoom factor: the
    // largest of the two per-axis scale requirements, so the tilted image
    // still fully covers its own original iw x ih frame on both axes.
    const scale = Math.max(cos + (ih / iw) * sin, (iw / ih) * sin + cos);

    const out = document.createElement("canvas");
    out.width = iw;
    out.height = ih;
    const octx = out.getContext("2d");
    octx.save();
    octx.translate(iw / 2, ih / 2);
    octx.rotate(theta);
    octx.scale(scale, scale);
    octx.drawImage(currentImage, -iw / 2, -ih / 2, iw, ih);
    octx.restore();

    fineRotatedSourceCanvas = out;
    fineRotatedSourceKey = key;
    return fineRotatedSourceCanvas;
  }

  function getRotatedNaturalSize() {
    const iw = currentImage.naturalWidth;
    const ih = currentImage.naturalHeight;
    return rotation === 90 || rotation === 270 ? { w: ih, h: iw } : { w: iw, h: ih };
  }

  function getRotatedFullCanvas() {
    const iw = currentImage.naturalWidth;
    const ih = currentImage.naturalHeight;
    const key = `${iw}x${ih}|${rotation}|${flipH}|${flipV}|${fineRotation}`;
    if (rotatedFullCanvas && rotatedFullKey === key) return rotatedFullCanvas;
    // drawRotatedFlipped's imgW/imgH args are the OUTPUT canvas size (i.e.
    // already swapped for a 90/270 rotation) -- getRotatedNaturalSize()
    // gives exactly that, while iw/ih above (the source's own dimensions)
    // are only used for the cache key.
    const outSize = getRotatedNaturalSize();
    rotatedFullCanvas = drawRotatedFlipped(getFineRotatedSource(), outSize.w, outSize.h, rotation, flipH, flipV);
    rotatedFullKey = key;
    return rotatedFullCanvas;
  }

  // Coalesce rapid slider "input" events (e.g. dragging) into at most one
  // render per animation frame.
  let renderScheduled = false;
  function scheduleRender() {
    if (renderScheduled) return;
    renderScheduled = true;
    requestAnimationFrame(() => {
      renderScheduled = false;
      render();
    });
  }

  function openFilePicker() {
    fileInput.click();
  }

  dropZone.addEventListener("click", openFilePicker);

  ["dragenter", "dragover"].forEach((evt) => {
    dropZone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropZone.classList.add("drag-over");
    });
  });

  ["dragleave", "drop"].forEach((evt) => {
    dropZone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropZone.classList.remove("drag-over");
    });
  });

  dropZone.addEventListener("drop", (e) => {
    const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) loadFile(file);
  });

  fileInput.addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0];
    if (file) loadFile(file);
  });

  function loadFile(file) {
    if (!file.type.startsWith("image/")) return;
    currentFileBaseName = (file.name || "photo").replace(/\.[^.]+$/, "") || "photo";

    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        currentImage = img;
        adjustedPhotoCanvas = null;
        adjustedPhotoKey = null;
        whiteBalanceGains = null;
        rawPhotoCanvas = null;
        compareMode = false;
        comparePos = 0.5;
        compareBtn.classList.remove("active");
        compareBtn.textContent = "Compare";
        canvas.classList.remove("comparing");
        cropRect = null;
        cropAdjusting = false;
        cropDragMode = null;
        cropDragStart = null;
        rotatedFullCanvas = null;
        rotatedFullKey = null;
        canvas.classList.remove("crop-adjusting");
        levelLineActive = false;
        levelLineStart = null;
        levelLineCurrent = null;
        levelLineBtn.classList.remove("active");
        levelLineHint.hidden = true;
        canvas.classList.remove("level-line-active");
        updateCropUiVisibility();
        rotation = 0;
        flipH = false;
        flipV = false;
        fineRotation = 0;
        fineRotateSlider.value = "0";
        fineRotateValue.textContent = "0°";
        fineRotatedSourceCanvas = null;
        fineRotatedSourceKey = null;
        resetPreviewZoom();
        editor.hidden = false;
        dropZone.hidden = true;
        render();
        resetHistory();
        editor.scrollIntoView({ behavior: "smooth", block: "start" });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function roundedRectPath(context, x, y, w, h, r) {
    const radius = Math.max(0, Math.min(r, w / 2, h / 2));
    context.beginPath();
    if (context.roundRect) {
      context.roundRect(x, y, w, h, radius);
    } else {
      context.moveTo(x + radius, y);
      context.arcTo(x + w, y, x + w, y + h, radius);
      context.arcTo(x + w, y + h, x, y + h, radius);
      context.arcTo(x, y + h, x, y, radius);
      context.arcTo(x, y, x + w, y, radius);
    }
    context.closePath();
  }

  // Given the bordered photo's own size (innerW x innerH), find the smallest
  // canvas with the requested aspect ratio that fully contains it -- so the
  // photo is never cropped, only padded (letterboxed/pillarboxed) to reach
  // that shape, centered.
  function getPaddedCanvasSize(innerW, innerH, ratioValue) {
    if (ratioValue === "original") {
      return { canvasW: innerW, canvasH: innerH };
    }

    const [rw, rh] = ratioValue.split(":").map(Number);
    const targetRatio = rw / rh;

    let canvasW, canvasH;
    if (innerW / targetRatio > innerH) {
      canvasW = innerW;
      canvasH = innerW / targetRatio;
    } else {
      canvasH = innerH;
      canvasW = innerH * targetRatio;
    }

    return { canvasW: Math.round(canvasW), canvasH: Math.round(canvasH) };
  }

  // Clamps to 0-255 AND rounds to an integer -- callers use this output both
  // as a final pixel value and as an index into the Uint8ClampedArray tone
  // LUT, which silently returns undefined (collapsing to black) for a
  // non-integer index. Always round before that lookup.
  function clamp8(v) {
    const r = Math.round(v);
    return r < 0 ? 0 : r > 255 ? 255 : r;
  }

  // 256-entry lookup table combining a brightness offset with an S-curve
  // (a smoothstep blend: gentle near black/white, steeper through the
  // midtones -- the classic photo-editing "pop" curve). curveAmount is
  // 0 (no effect) to 1 (full curve); kept in that range so the result
  // stays monotonic (no posterization/inversion artifacts).
  function buildToneLUT(brightness, curveAmount) {
    const lut = new Uint8ClampedArray(256);
    for (let i = 0; i < 256; i++) {
      const withBrightness = clamp8(i + brightness);
      const x = withBrightness / 255;
      const smoothstep = x * x * (3 - 2 * x);
      const y = x + curveAmount * (smoothstep - x);
      lut[i] = Math.round(clamp8(y * 255));
    }
    return lut;
  }

  // Auto white balance: a standard "gray world" correction. It assumes
  // that, averaged over a whole photo, the scene's true colors roughly
  // cancel out to neutral gray -- so if the photo's actual average color
  // is off-gray (e.g. everything's a bit orange from indoor tungsten
  // lighting, or a bit blue from open shade), that average IS the color
  // cast, and scaling each channel to pull the average back to neutral
  // removes it. Computed once per photo from a small downscaled copy
  // (plenty for a stable average, much faster than scanning every pixel),
  // and the per-channel gains are clamped to a moderate range so a photo
  // that's genuinely dominated by one color (a sunset, a wall of green
  // grass) gets nudged rather than drastically recolored.
  function getWhiteBalanceGains() {
    if (whiteBalanceGains) return whiteBalanceGains;

    const maxDim = 200;
    const scale = Math.min(1, maxDim / Math.max(currentImage.naturalWidth, currentImage.naturalHeight));
    const sw = Math.max(1, Math.round(currentImage.naturalWidth * scale));
    const sh = Math.max(1, Math.round(currentImage.naturalHeight * scale));

    const sampleCanvas = document.createElement("canvas");
    sampleCanvas.width = sw;
    sampleCanvas.height = sh;
    const sctx = sampleCanvas.getContext("2d");
    sctx.drawImage(currentImage, 0, 0, sw, sh);
    const { data } = sctx.getImageData(0, 0, sw, sh);

    // A plain average over-corrects any photo with one big, vividly-colored
    // region -- a blue sky, ocean, or a lot of grass/foliage -- because
    // gray-world can't tell "the scene is naturally this color" apart from
    // "the lighting has a cast," and ends up nudging the whole photo warmer
    // or cooler to compensate for what's really just the scene itself (this
    // is exactly what was happening on landscape photos: a sky-heavy shot
    // has more blue than red/green on average, so it got warmed to
    // "balance" that out, even when the photo's own colors were already
    // fine). A first fix -- weighting every pixel down by how saturated it
    // is -- helped but wasn't enough: measured against a real sky-heavy
    // landscape (roughly 55% sky), a wide range of weighting strengths all
    // left a clearly visible warm shift on the sky, because with that much
    // of the frame that vivid, even a steep per-pixel discount doesn't stop
    // sheer numbers from winning.
    //
    // Using only the calmer HALF of the photo -- the least saturated 50% of
    // sampled pixels, wherever they fall (sky, grass, and water are almost
    // always the most saturated content in a photo, so this naturally
    // excludes most of them) -- fixes this properly, without weakening
    // real casts: a genuine cast (indoor tungsten/fluorescent light, open
    // shade) shows up on a photo's calmer surfaces too -- walls, skin,
    // pavement -- so the median-based average still sees it and corrects
    // for it.
    const pixelCount = data.length / 4;
    const saturations = new Float32Array(pixelCount);
    for (let i = 0, p = 0; i < data.length; i += 4, p++) {
      const r = data[i], g = data[i + 1], b = data[i + 2];
      const maxC = Math.max(r, g, b);
      const minC = Math.min(r, g, b);
      saturations[p] = maxC > 0 ? (maxC - minC) / maxC : 0;
    }
    const sortedSaturations = Array.from(saturations).sort((a, b) => a - b);
    const medianCutoff = sortedSaturations[Math.floor(sortedSaturations.length / 2)];

    let sumR = 0, sumG = 0, sumB = 0, count = 0;
    for (let i = 0, p = 0; i < data.length; i += 4, p++) {
      if (saturations[p] > medianCutoff) continue;
      sumR += data[i];
      sumG += data[i + 1];
      sumB += data[i + 2];
      count++;
    }
    const avgR = sumR / Math.max(1, count);
    const avgG = sumG / Math.max(1, count);
    const avgB = sumB / Math.max(1, count);
    const gray = (avgR + avgG + avgB) / 3;

    const clampGain = (g) => Math.min(1.6, Math.max(0.6, g));
    whiteBalanceGains = {
      r: clampGain(gray / Math.max(1, avgR)),
      g: clampGain(gray / Math.max(1, avgG)),
      b: clampGain(gray / Math.max(1, avgB)),
    };
    return whiteBalanceGains;
  }

  // Returns a canvas containing just the photo (no border/padding) with
  // auto white balance, brightness, saturation, and S-curve baked in.
  // Cached and only recomputed when those values (or the photo itself)
  // change.
  // Draws a source canvas onto a new imgW x imgH canvas, applying rotation
  // (0/90/180/270) and horizontal/vertical flip. Scale (flip) is applied
  // before rotate in the transform chain -- since canvas transforms compose
  // in reverse call order, that means rotate reaches the source pixels
  // first and scale second, so a flip mirrors whatever is CURRENTLY
  // displayed (post-rotation), matching what the user sees on screen,
  // rather than mirroring the original unrotated photo.
  function drawRotatedFlipped(sourceCanvas, imgW, imgH, rot, fH, fV) {
    if (rot === 0 && !fH && !fV) return sourceCanvas;
    const out = document.createElement("canvas");
    out.width = imgW;
    out.height = imgH;
    const octx = out.getContext("2d");
    octx.save();
    octx.translate(imgW / 2, imgH / 2);
    octx.scale(fH ? -1 : 1, fV ? -1 : 1);
    octx.rotate((rot * Math.PI) / 180);
    octx.drawImage(sourceCanvas, -sourceCanvas.width / 2, -sourceCanvas.height / 2);
    octx.restore();
    return out;
  }

  function getAdjustedPhotoCanvas(imgW, imgH, cropRect) {
    const brightness = parseInt(brightnessSlider.value, 10);
    const saturation = parseInt(saturationSlider.value, 10);
    const curveAmount = parseInt(curveSlider.value, 10) / 100;
    const autoWb = autoWbToggle.checked;
    const rotatedFull = getRotatedFullCanvas();
    const cropKey = cropRect ? `${cropRect.x},${cropRect.y},${cropRect.w},${cropRect.h}` : "full";
    const key = `${brightness}|${saturation}|${curveAmount}|${autoWb}|${imgW}x${imgH}|${cropKey}|${rotatedFullKey}`;

    if (adjustedPhotoCanvas && adjustedPhotoKey === key) {
      return adjustedPhotoCanvas;
    }

    // Rotation/flip already happened once, upstream, in
    // getRotatedFullCanvas() -- this just crops out of that shared result
    // and applies the per-photo color edits, at the crop's own dimensions.
    const sourceCanvas = document.createElement("canvas");
    sourceCanvas.width = imgW;
    sourceCanvas.height = imgH;
    const pctx = sourceCanvas.getContext("2d");
    const sx = cropRect ? cropRect.x : 0;
    const sy = cropRect ? cropRect.y : 0;
    pctx.drawImage(rotatedFull, sx, sy, imgW, imgH, 0, 0, imgW, imgH);

    if (brightness !== 0 || saturation !== 0 || curveAmount !== 0 || autoWb) {
      const lut = buildToneLUT(brightness, curveAmount);
      const satFactor = 1 + saturation / 100;
      const gains = autoWb ? getWhiteBalanceGains() : null;
      const imageData = pctx.getImageData(0, 0, imgW, imgH);
      const data = imageData.data;

      for (let i = 0; i < data.length; i += 4) {
        let r0 = data[i];
        let g0 = data[i + 1];
        let b0 = data[i + 2];

        // Auto white balance is a base color correction, so it's applied
        // first -- the sliders below then work from the already-neutralized
        // colors, same as they would on a photo that never had a cast to
        // begin with.
        if (gains) {
          r0 = clamp8(r0 * gains.r);
          g0 = clamp8(g0 * gains.g);
          b0 = clamp8(b0 * gains.b);
        }

        let r = r0, g = g0, b = b0;

        r = lut[r];
        g = lut[g];
        b = lut[b];

        if (saturation !== 0) {
          const lum = 0.299 * r + 0.587 * g + 0.114 * b;
          r = lum + (r - lum) * satFactor;
          g = lum + (g - lum) * satFactor;
          b = lum + (b - lum) * satFactor;
        }

        data[i] = clamp8(r);
        data[i + 1] = clamp8(g);
        data[i + 2] = clamp8(b);
      }

      pctx.putImageData(imageData, 0, 0);
    }

    adjustedPhotoCanvas = sourceCanvas;
    adjustedPhotoKey = key;
    return sourceCanvas;
  }

  // Computes the border/frame geometry shared by the normal render and the
  // before/after comparison overlay -- both need the exact same canvas
  // size and photo placement, since only the PHOTO's pixels differ between
  // "before" and "after", never the frame around it.
  function computeLayout() {
    // cropRect (module-level) is already in the ROTATED photo's own pixel
    // space -- see getRotatedFullCanvas -- so no pre/post-rotation swap is
    // needed here, unlike the old crop-to-fill system.
    const natural = getRotatedNaturalSize();
    const imgW = cropRect ? cropRect.w : natural.w;
    const imgH = cropRect ? cropRect.h : natural.h;
    const shortSide = Math.min(imgW, imgH);

    const widthPct = parseFloat(widthSlider.value);
    const style = styleSelect.value;
    const color = colorInput.value;
    const radiusPct = parseFloat(radiusSlider.value);

    const baseBorder = Math.round((widthPct / 100) * shortSide);

    let top = baseBorder;
    let left = baseBorder;
    let right = baseBorder;
    let bottom = baseBorder;

    if (style === "polaroid") {
      bottom = Math.round(baseBorder * 2.6) + (baseBorder === 0 ? Math.round(shortSide * 0.08) : 0);
    }

    const innerW = imgW + left + right;
    const innerH = imgH + top + bottom;

    const { canvasW, canvasH } = getPaddedCanvasSize(innerW, innerH, aspectSelect.value);

    // corner radius scales with the shorter output side
    const radius = Math.round((radiusPct / 100) * Math.min(canvasW, canvasH) * 0.5);

    const offsetX = Math.round((canvasW - innerW) / 2);
    const offsetY = Math.round((canvasH - innerH) / 2);

    return { imgW, imgH, left, top, color, radius, canvasW, canvasH, offsetX, offsetY, cropRect, rotation, flipH, flipV };
  }

  // Draws the full bordered/padded frame -- using whichever photo canvas
  // is passed in -- onto any target context. Shared by the normal render
  // and the "before" half of the comparison overlay.
  function drawFrame(targetCtx, photoCanvas, layout) {
    const { canvasW, canvasH, radius, color, offsetX, offsetY, left, top, imgW, imgH } = layout;
    targetCtx.clearRect(0, 0, canvasW, canvasH);
    targetCtx.save();
    roundedRectPath(targetCtx, 0, 0, canvasW, canvasH, radius);
    targetCtx.clip();
    targetCtx.fillStyle = color;
    targetCtx.fillRect(0, 0, canvasW, canvasH);
    targetCtx.drawImage(photoCanvas, offsetX + left, offsetY + top, imgW, imgH);
    targetCtx.restore();
  }

  // The plain, unedited photo -- no auto WB or quick edits -- used as the
  // "before" side of the comparison slider. Cached since it only depends
  // on the photo itself.
  let rawPhotoCanvas = null;
  let rawPhotoKey = null;
  function getRawPhotoCanvas(imgW, imgH, cropRect) {
    const rotatedFull = getRotatedFullCanvas();
    const cropKey = cropRect ? `${cropRect.x},${cropRect.y},${cropRect.w},${cropRect.h}` : "full";
    const key = `${imgW}x${imgH}|${cropKey}|${rotatedFullKey}`;
    if (rawPhotoCanvas && rawPhotoKey === key) {
      return rawPhotoCanvas;
    }
    const sx = cropRect ? cropRect.x : 0;
    const sy = cropRect ? cropRect.y : 0;
    const c = document.createElement("canvas");
    c.width = imgW;
    c.height = imgH;
    c.getContext("2d").drawImage(rotatedFull, sx, sy, imgW, imgH, 0, 0, imgW, imgH);
    rawPhotoCanvas = c;
    rawPhotoKey = key;
    return c;
  }

  // Compare mode: drag a divider across the canvas to reveal the original,
  // unedited photo on one side. Only the photo's own pixels swap -- the
  // border/frame is identical either side, so the comparison isolates
  // exactly what the quick edits/auto WB are doing.
  let compareMode = false;
  let comparePos = 0.5; // 0 (all "before", left) to 1 (all "after", right)
  let compareCanvas = null; // reused offscreen canvas for the "before" frame

  function drawCompareOverlay(layout) {
    if (!compareCanvas) compareCanvas = document.createElement("canvas");
    compareCanvas.width = layout.canvasW;
    compareCanvas.height = layout.canvasH;
    const rawPhoto = getRawPhotoCanvas(layout.imgW, layout.imgH, layout.cropRect);
    drawFrame(compareCanvas.getContext("2d"), rawPhoto, layout);

    const splitX = Math.round(comparePos * layout.canvasW);

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, splitX, layout.canvasH);
    ctx.clip();
    ctx.drawImage(compareCanvas, 0, 0);
    ctx.restore();

    // divider line + drag handle
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,0.9)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(splitX + 0.5, 0);
    ctx.lineTo(splitX + 0.5, layout.canvasH);
    ctx.stroke();

    const handleY = layout.canvasH / 2;
    const handleR = Math.max(16, Math.min(24, layout.canvasW * 0.04));
    ctx.beginPath();
    ctx.arc(splitX, handleY, handleR, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(20,20,24,0.75)";
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.9)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.font = `${Math.round(handleR)}px sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("↔", splitX, handleY + 1);

    // small "BEFORE" / "AFTER" labels near the top corners
    ctx.font = "bold 12px sans-serif";
    ctx.textBaseline = "top";
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    if (splitX > 60) {
      ctx.textAlign = "left";
      ctx.fillText("BEFORE", 10, 10);
    }
    if (layout.canvasW - splitX > 55) {
      ctx.textAlign = "right";
      ctx.fillText("AFTER", layout.canvasW - 10, 10);
    }
    ctx.restore();
  }

  function render() {
    if (!currentImage) return;
    canvas.classList.toggle("straighten-grid-visible", isStraightenGridVisible());

    if (cropAdjusting) {
      renderCropAdjust();
      return;
    }

    const layout = computeLayout();

    // The photo's rendered pixel dimensions changed (new photo, aspect,
    // border, crop, or rotation) -- any cached "un-zoomed" on-screen size
    // is now stale, so drop back to 100% rather than zoom to the wrong
    // dimensions.
    if (layout.canvasW !== lastLayoutW || layout.canvasH !== lastLayoutH) {
      lastLayoutW = layout.canvasW;
      lastLayoutH = layout.canvasH;
      if (previewZoom !== 1) resetPreviewZoom();
    }

    canvas.width = layout.canvasW;
    canvas.height = layout.canvasH;

    const adjustedPhoto = getAdjustedPhotoCanvas(layout.imgW, layout.imgH, layout.cropRect);
    drawFrame(ctx, adjustedPhoto, layout);

    if (compareMode) {
      drawCompareOverlay(layout);
    }

    if (isStraightenGridVisible()) {
      drawStraightenGrid(layout);
    }
    if (levelLineActive) {
      drawLevelLineOverlay();
    }
  }

  // ---- Crop tool -----------------------------------------------------
  //
  // A resizable rectangle overlaid directly on the full (rotated) photo:
  // drag inside it to move it, drag a corner to resize it. The ratio
  // dropdown either locks the box to a ratio (recomputed as you resize) or
  // leaves it freeform. The rectangle lives in the rotated photo's own
  // pixel space (see getRotatedFullCanvas), so what you drag is exactly
  // what ends up cropped -- no separate coordinate mapping.

  // The crop overlay is drawn at the photo's own (native) pixel resolution,
  // then scaled down by CSS to fit the screen -- so a handle/line size
  // that's a fixed number of CANVAS pixels ends up a wildly different
  // on-screen size depending on the photo's resolution: fine on a small
  // test image, but on a real phone photo (e.g. 3024x4032) it shrinks to a
  // sliver once scaled down to fit the display. Sizing everything in CSS
  // pixels instead -- converted through the current display scale -- keeps
  // the handles a consistent, comfortably tappable size on any photo.
  const CROP_HANDLE_VISUAL_RADIUS_CSS = 15; // on-screen circle, in CSS px
  const CROP_HANDLE_HIT_RADIUS_CSS = 30; // touch target, in CSS px -- bigger
  // than the visible dot so it's forgiving to tap on a phone without
  // looking oversized.
  const CROP_BOX_BORDER_CSS = 2.5;
  const CROP_GRID_LINE_CSS = 1;
  // How far the box starts inset from each edge of the photo, as a
  // fraction of that dimension, the first time you crop a photo (10% in
  // from each side -- an 80%-sized box) -- see enterCropAdjust.
  const CROP_DEFAULT_INSET = 0.1;

  // Canvas pixels per on-screen CSS pixel -- shared by the crop tool and
  // the Level-line tool below, since both need to size handles/lines
  // consistently on screen regardless of the photo's actual resolution,
  // and to convert a pointer event's page coordinates into canvas-pixel
  // coordinates (see canvasPointToPixel).
  function canvasDisplayScale() {
    const rect = canvas.getBoundingClientRect();
    return rect.width > 0 ? canvas.width / rect.width : 1;
  }

  function cropHandleVisualRadius(scale) {
    return CROP_HANDLE_VISUAL_RADIUS_CSS * scale;
  }

  function cropHandleHitRadius(scale) {
    return CROP_HANDLE_HIT_RADIUS_CSS * scale;
  }

  function cropHandlePositions(r) {
    return [
      { name: "nw", x: r.x, y: r.y },
      { name: "ne", x: r.x + r.w, y: r.y },
      { name: "sw", x: r.x, y: r.y + r.h },
      { name: "se", x: r.x + r.w, y: r.y + r.h },
    ];
  }

  function hitTestCropHandle(px, py, r, hitRadius) {
    for (const h of cropHandlePositions(r)) {
      if (Math.hypot(px - h.x, py - h.y) <= hitRadius) return h.name;
    }
    return null;
  }

  function currentCropRatio() {
    const v = cropRatioSelect.value;
    if (!v || v === "freeform") return null;
    if (v === "original") {
      const n = getRotatedNaturalSize();
      return n.w / n.h;
    }
    const [rw, rh] = v.split(":").map(Number);
    return rw / rh;
  }

  // Resizes a crop rect by dragging one corner while the opposite corner
  // (anchor) stays fixed. With a ratio, the box is grown along whichever
  // axis the pointer moved further in (so it tracks the drag naturally),
  // then the other axis is derived to match the ratio; a single proportional
  // scale factor -- never independent per-axis clamping -- keeps it from
  // drifting off-ratio when it has to be shrunk (or grown) to fit the photo.
  function computeResizedRect(anchor, px, py, natural, ratio) {
    const minSize = Math.max(16, Math.min(natural.w, natural.h) * 0.05);
    const freeW = Math.abs(px - anchor.x);
    const freeH = Math.abs(py - anchor.y);
    const signX = px >= anchor.x ? 1 : -1;
    const signY = py >= anchor.y ? 1 : -1;

    let w, h;
    if (ratio) {
      if (freeH <= 0 || freeW / ratio >= freeH) {
        w = freeW;
        h = w / ratio;
      } else {
        h = freeH;
        w = h * ratio;
      }
    } else {
      w = freeW;
      h = freeH;
    }

    const maxW = signX === 1 ? natural.w - anchor.x : anchor.x;
    const maxH = signY === 1 ? natural.h - anchor.y : anchor.y;

    if (ratio) {
      const shrink = Math.min(1, maxW / Math.max(1, w), maxH / Math.max(1, h));
      w *= shrink;
      h *= shrink;
      const grow = Math.min(
        Math.max(1, minSize / Math.max(1, w), minSize / Math.max(1, h)),
        maxW / Math.max(1, w),
        maxH / Math.max(1, h)
      );
      w *= grow;
      h *= grow;
    } else {
      w = Math.min(Math.max(w, Math.min(minSize, maxW)), maxW);
      h = Math.min(Math.max(h, Math.min(minSize, maxH)), maxH);
    }

    const x0 = signX === 1 ? anchor.x : anchor.x - w;
    const y0 = signY === 1 ? anchor.y : anchor.y - h;

    return {
      x: Math.round(Math.min(Math.max(x0, 0), natural.w - w)),
      y: Math.round(Math.min(Math.max(y0, 0), natural.h - h)),
      w: Math.round(w),
      h: Math.round(h),
    };
  }

  // Re-fits the current crop rect to a newly-chosen ratio: the largest
  // ratio-shaped box that fits inside the existing rect, centered on it.
  function applyCropRatioToRect(ratio) {
    if (!cropRect || !ratio) return;
    const natural = getRotatedNaturalSize();
    const cx = cropRect.x + cropRect.w / 2;
    const cy = cropRect.y + cropRect.h / 2;
    let w = cropRect.w;
    let h = w / ratio;
    if (h > cropRect.h) {
      h = cropRect.h;
      w = h * ratio;
    }
    w = Math.min(w, natural.w);
    h = Math.min(h, natural.h);
    const x = Math.min(Math.max(cx - w / 2, 0), natural.w - w);
    const y = Math.min(Math.max(cy - h / 2, 0), natural.h - h);
    cropRect = { x: Math.round(x), y: Math.round(y), w: Math.round(w), h: Math.round(h) };
  }

  function renderCropAdjust() {
    const natural = getRotatedNaturalSize();
    canvas.width = natural.w;
    canvas.height = natural.h;

    // Read the display scale only after the canvas's own pixel size is set
    // above -- that's what determines its on-screen CSS size (via the
    // max-width/max-height rules), which is what this scale is relative to.
    const scale = canvasDisplayScale();

    const photo = getRotatedFullCanvas();
    ctx.clearRect(0, 0, natural.w, natural.h);
    ctx.drawImage(photo, 0, 0);

    const r = cropRect || { x: 0, y: 0, w: natural.w, h: natural.h };

    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(0, 0, natural.w, r.y);
    ctx.fillRect(0, r.y + r.h, natural.w, natural.h - r.y - r.h);
    ctx.fillRect(0, r.y, r.x, r.h);
    ctx.fillRect(r.x + r.w, r.y, natural.w - r.x - r.w, r.h);
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,0.55)";
    ctx.lineWidth = CROP_GRID_LINE_CSS * scale;
    for (let i = 1; i <= 2; i++) {
      const gx = r.x + (r.w * i) / 3;
      ctx.beginPath();
      ctx.moveTo(gx, r.y);
      ctx.lineTo(gx, r.y + r.h);
      ctx.stroke();
      const gy = r.y + (r.h * i) / 3;
      ctx.beginPath();
      ctx.moveTo(r.x, gy);
      ctx.lineTo(r.x + r.w, gy);
      ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = CROP_BOX_BORDER_CSS * scale;
    ctx.strokeRect(r.x, r.y, r.w, r.h);
    ctx.restore();

    const handleR = cropHandleVisualRadius(scale);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.strokeStyle = "rgba(0,0,0,0.4)";
    ctx.lineWidth = CROP_GRID_LINE_CSS * scale;
    for (const h of cropHandlePositions(r)) {
      ctx.beginPath();
      ctx.arc(h.x, h.y, handleR, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();
  }

  // Shared by crop-adjust and the Level-line tool below: both take over
  // the canvas for direct-manipulation dragging, so the buttons that
  // normally float on top of (or sit just above) the photo step aside
  // while either one is active, and come back once neither is.
  function updateOverlayControlsVisibility() {
    const busy = cropAdjusting || levelLineActive;
    canvasToolbarLeft.hidden = busy;
    compareBtn.hidden = busy;
    transformRow.hidden = busy;
  }

  function updateCropUiVisibility() {
    cropDoneBtn.hidden = !cropAdjusting;
    canvas.classList.toggle("crop-adjusting", cropAdjusting);
    cropRemoveBtn.hidden = !cropRect;
    cropBtn.textContent = cropRect ? "Edit Crop" : "Crop…";
    updateOverlayControlsVisibility();
  }

  function enterCropAdjust() {
    if (!currentImage || cropAdjusting) return;
    if (compareMode) {
      compareMode = false;
      compareBtn.classList.remove("active");
      compareBtn.textContent = "Compare";
      canvas.classList.remove("comparing");
    }
    // The Level-line tool has no in-progress state worth preserving (just
    // an unfinished drag, if any), so opening Crop while it's active simply
    // cancels it rather than blocking Crop or leaving both tools "on".
    if (levelLineActive) exitLevelLineMode();
    cropAdjusting = true;
    const natural = getRotatedNaturalSize();
    cropHadExistingOnEntry = !!cropRect;
    cropRatioChangedDuringAdjust = false;
    if (!cropRect) {
      // Start inset from the full photo (not edge-to-edge) -- that way the
      // darkened mask and the corner handles are all visible and easy to
      // grab right away, instead of starting maxed out with the handles
      // sitting exactly on the canvas boundary.
      const marginX = Math.round(natural.w * CROP_DEFAULT_INSET);
      const marginY = Math.round(natural.h * CROP_DEFAULT_INSET);
      cropRect = {
        x: marginX,
        y: marginY,
        w: natural.w - marginX * 2,
        h: natural.h - marginY * 2,
      };
      // The ratio dropdown now lives in the panel, so it's reachable (and
      // may already be set to something other than Freeform) before Crop
      // is even tapped -- honor it on the fresh default box right away.
      applyCropRatioToRect(currentCropRatio());
    }
    cropRectAtEntry = { ...cropRect };
    resetPreviewZoom();
    updateCropUiVisibility();
    render();
  }

  function exitCropAdjust() {
    cropAdjusting = false;
    // If this crop started fresh (no existing crop when Crop was tapped)
    // and the box is still exactly the auto-generated default -- i.e. the
    // user opened the tool and tapped Done without actually dragging
    // anything -- treat it as "never cropped" rather than silently
    // applying that default inset.
    if (cropRect && !cropHadExistingOnEntry && cropRectAtEntry && !cropRatioChangedDuringAdjust) {
      const unchanged =
        cropRect.x === cropRectAtEntry.x &&
        cropRect.y === cropRectAtEntry.y &&
        cropRect.w === cropRectAtEntry.w &&
        cropRect.h === cropRectAtEntry.h;
      if (unchanged) cropRect = null;
    }
    updateCropUiVisibility();
    render();
    pushHistory();
  }

  cropBtn.addEventListener("click", enterCropAdjust);
  cropDoneBtn.addEventListener("click", exitCropAdjust);

  cropRemoveBtn.addEventListener("click", () => {
    cropRect = null;
    // This button is reachable both while just browsing a saved crop and
    // while actively inside crop-adjust mode. In the latter case, removing
    // the crop should also back out of the tool -- there's nothing left to
    // adjust, so leaving cropAdjusting on would strand the user in the
    // crop overlay (showing an edge-to-edge box) until they separately tap
    // Done.
    cropAdjusting = false;
    updateCropUiVisibility();
    scheduleRender();
    pushHistory();
  });

  cropRatioSelect.addEventListener("change", () => {
    if (cropAdjusting) cropRatioChangedDuringAdjust = true;
    applyCropRatioToRect(currentCropRatio());
    render();
  });

  // Converts a pointer event's page coordinates into canvas-pixel
  // coordinates -- shared by the crop tool and the Level-line tool below.
  function canvasPointToPixel(e) {
    const rect = canvas.getBoundingClientRect();
    const scale = canvasDisplayScale();
    return {
      x: (e.clientX - rect.left) * scale,
      y: (e.clientY - rect.top) * scale,
    };
  }

  canvas.addEventListener("pointerdown", (e) => {
    if (!cropAdjusting || !cropRect) return;
    const pt = canvasPointToPixel(e);
    const hitRadius = cropHandleHitRadius(canvasDisplayScale());
    const handle = hitTestCropHandle(pt.x, pt.y, cropRect, hitRadius);

    if (handle) {
      const opposite = { nw: "se", ne: "sw", sw: "ne", se: "nw" }[handle];
      const anchorPos = cropHandlePositions(cropRect).find((h) => h.name === opposite);
      cropDragMode = handle;
      cropDragStart = { anchor: { x: anchorPos.x, y: anchorPos.y } };
    } else if (
      pt.x >= cropRect.x &&
      pt.x <= cropRect.x + cropRect.w &&
      pt.y >= cropRect.y &&
      pt.y <= cropRect.y + cropRect.h
    ) {
      cropDragMode = "move";
      cropDragStart = { startRect: { ...cropRect }, startX: pt.x, startY: pt.y };
    } else {
      return;
    }
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener("pointermove", (e) => {
    if (!cropAdjusting || !cropDragMode) return;
    const natural = getRotatedNaturalSize();
    const pt = canvasPointToPixel(e);

    if (cropDragMode === "move") {
      const dx = pt.x - cropDragStart.startX;
      const dy = pt.y - cropDragStart.startY;
      const { startRect } = cropDragStart;
      cropRect = {
        x: Math.round(Math.min(Math.max(startRect.x + dx, 0), natural.w - startRect.w)),
        y: Math.round(Math.min(Math.max(startRect.y + dy, 0), natural.h - startRect.h)),
        w: startRect.w,
        h: startRect.h,
      };
    } else {
      const px = Math.min(natural.w, Math.max(0, pt.x));
      const py = Math.min(natural.h, Math.max(0, pt.y));
      cropRect = computeResizedRect(cropDragStart.anchor, px, py, natural, currentCropRatio());
    }
    render();
  });

  canvas.addEventListener("pointerup", () => {
    if (!cropDragMode) return;
    cropDragMode = null;
    cropDragStart = null;
  });
  canvas.addEventListener("pointercancel", () => {
    cropDragMode = null;
    cropDragStart = null;
  });

  // ---- Level-line tool -------------------------------------------------
  //
  // Draw a line along anything that should read as level or plumb -- a
  // wall edge, a horizon, a shelf -- and Straighten snaps to whichever is
  // closer (level if the line's within 45° of horizontal, plumb
  // otherwise), applied ON TOP of whatever Straighten amount is already
  // set. That "on top of" part is what makes the math independent of the
  // current tilt: the line is drawn on the photo exactly as displayed
  // (already reflecting any existing Straighten), so the correction it
  // implies is just the negative of that line's own on-screen angle --
  // see computeLevelCorrection.

  const LEVEL_LINE_WIDTH_CSS = 2.5;
  const LEVEL_LINE_DOT_RADIUS_CSS = 6;
  // Shorter drags are treated as an accidental tap, not a real line, since
  // their angle is too noisy to trust.
  const LEVEL_LINE_MIN_DRAG_CSS = 20;

  // Folds any angle down to the (-90, 90] range -- the two ends of that
  // range both mean "vertical", so this is really "how far this line's
  // orientation sits from horizontal, signed", independent of which
  // direction it was drawn in.
  function normalizeAngle180(deg) {
    let a = deg % 180;
    if (a <= -90) a += 180;
    if (a > 90) a -= 180;
    return a;
  }

  // The rotation to apply on top of the current Straighten amount so the
  // drawn line becomes level (target 0°) or plumb (target +/-90°),
  // whichever it's already closer to.
  function computeLevelCorrection(angleNorm) {
    if (Math.abs(angleNorm) <= 45) return -angleNorm;
    return angleNorm > 0 ? 90 - angleNorm : -90 - angleNorm;
  }

  function levelLineDragVector() {
    if (!levelLineStart || !levelLineCurrent) return null;
    const dx = levelLineCurrent.x - levelLineStart.x;
    const dy = levelLineCurrent.y - levelLineStart.y;
    return { dx, dy, dist: Math.hypot(dx, dy) };
  }

  function enterLevelLineMode() {
    if (!currentImage || levelLineActive || cropAdjusting) return;
    if (compareMode) {
      compareMode = false;
      compareBtn.classList.remove("active");
      compareBtn.textContent = "Compare";
      canvas.classList.remove("comparing");
    }
    levelLineActive = true;
    levelLineStart = null;
    levelLineCurrent = null;
    levelLineBtn.classList.add("active");
    levelLineHint.hidden = false;
    canvas.classList.add("level-line-active");
    updateOverlayControlsVisibility();
    render();
  }

  function exitLevelLineMode() {
    levelLineActive = false;
    levelLineStart = null;
    levelLineCurrent = null;
    levelLineBtn.classList.remove("active");
    levelLineHint.hidden = true;
    canvas.classList.remove("level-line-active");
    updateOverlayControlsVisibility();
    render();
  }

  levelLineBtn.addEventListener("click", () => {
    if (levelLineActive) exitLevelLineMode();
    else enterLevelLineMode();
  });

  canvas.addEventListener("pointerdown", (e) => {
    if (!levelLineActive) return;
    const pt = canvasPointToPixel(e);
    levelLineStart = pt;
    levelLineCurrent = pt;
    canvas.setPointerCapture(e.pointerId);
    render();
  });

  canvas.addEventListener("pointermove", (e) => {
    if (!levelLineActive || !levelLineStart) return;
    levelLineCurrent = canvasPointToPixel(e);
    render();
  });

  canvas.addEventListener("pointerup", () => {
    if (!levelLineActive || !levelLineStart) return;
    const vector = levelLineDragVector();
    const scale = canvasDisplayScale();
    if (vector && vector.dist >= LEVEL_LINE_MIN_DRAG_CSS * scale) {
      const angleNorm = normalizeAngle180((Math.atan2(vector.dy, vector.dx) * 180) / Math.PI);
      const correction = computeLevelCorrection(angleNorm);
      let next = Math.max(-45, Math.min(45, fineRotation + correction));
      next = Math.round(next * 2) / 2; // match the slider's own 0.5° step
      fineRotation = next;
      fineRotateSlider.value = String(fineRotation);
      fineRotateValue.textContent = `${fineRotation}°`;
      pushHistory();
    }
    // A single drag is the whole interaction -- draw again by tapping the
    // button once more, rather than staying in a mode that would otherwise
    // block Crop/Compare until explicitly dismissed.
    exitLevelLineMode();
  });
  canvas.addEventListener("pointercancel", () => {
    if (!levelLineActive) return;
    exitLevelLineMode();
  });

  function drawLevelLineOverlay() {
    const vector = levelLineDragVector();
    if (!vector) return;
    const scale = canvasDisplayScale();

    ctx.save();
    ctx.strokeStyle = "#ff5a36";
    ctx.fillStyle = "#ff5a36";
    ctx.lineWidth = LEVEL_LINE_WIDTH_CSS * scale;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(levelLineStart.x, levelLineStart.y);
    ctx.lineTo(levelLineCurrent.x, levelLineCurrent.y);
    ctx.stroke();
    for (const p of [levelLineStart, levelLineCurrent]) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, LEVEL_LINE_DOT_RADIUS_CSS * scale, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // Live readout of the correction this line would apply, so the exact
    // number is visible before committing to it by lifting the finger.
    if (vector.dist >= LEVEL_LINE_MIN_DRAG_CSS * scale) {
      const angleNorm = normalizeAngle180((Math.atan2(vector.dy, vector.dx) * 180) / Math.PI);
      const correction = computeLevelCorrection(angleNorm);
      const label = `${correction >= 0 ? "+" : ""}${correction.toFixed(1)}°`;
      ctx.save();
      ctx.font = `${13 * scale}px sans-serif`;
      ctx.textBaseline = "bottom";
      ctx.lineWidth = 3 * scale;
      ctx.strokeStyle = "rgba(0,0,0,0.6)";
      ctx.fillStyle = "#fff";
      const lx = levelLineCurrent.x + 12 * scale;
      const ly = levelLineCurrent.y - 12 * scale;
      ctx.strokeText(label, lx, ly);
      ctx.fillText(label, lx, ly);
      ctx.restore();
    }
  }

  function drawStraightenGrid(layout) {
    const scale = canvasDisplayScale();
    const divisions = 8;
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 1 * scale;
    for (let i = 1; i < divisions; i++) {
      const x = (layout.canvasW * i) / divisions;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, layout.canvasH);
      ctx.stroke();
      const y = (layout.canvasH * i) / divisions;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(layout.canvasW, y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function clientXToComparePos(clientX) {
    const rect = canvas.getBoundingClientRect();
    if (rect.width === 0) return comparePos;
    return Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
  }

  let isDraggingCompare = false;

  compareBtn.addEventListener("click", () => {
    if (cropAdjusting || levelLineActive) return;
    compareMode = !compareMode;
    compareBtn.classList.toggle("active", compareMode);
    compareBtn.textContent = compareMode ? "Done" : "Compare";
    canvas.classList.toggle("comparing", compareMode);
    if (compareMode) comparePos = 0.5;
    render();
  });

  canvas.addEventListener("pointerdown", (e) => {
    if (!compareMode) return;
    isDraggingCompare = true;
    comparePos = clientXToComparePos(e.clientX);
    canvas.setPointerCapture(e.pointerId);
    render();
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!isDraggingCompare) return;
    comparePos = clientXToComparePos(e.clientX);
    render();
  });
  canvas.addEventListener("pointerup", () => {
    isDraggingCompare = false;
  });
  canvas.addEventListener("pointercancel", () => {
    isDraggingCompare = false;
  });

  // Remember settings between visits: everything here is a "how I like my
  // photos framed" style preference (border, color, style, corners, ratio,
  // auto WB, max-size limit) rather than a one-off edit for a specific
  // photo, so it's saved to this browser and restored
  // next time -- handy since this is normally reopened fresh on a phone.
  // Deliberately excludes the brightness/vivid/S-curve sliders, since those
  // are per-photo touch-ups, not a standing preference. Wrapped in
  // try/catch since localStorage can throw (private browsing, disabled
  // storage) -- if so, the tool just behaves as it always did, with no
  // memory between visits.
  const SETTINGS_KEY = "borderToolSettings";

  function saveSettings() {
    try {
      localStorage.setItem(
        SETTINGS_KEY,
        JSON.stringify({
          aspect: aspectSelect.value,
          width: widthSlider.value,
          color: colorInput.value,
          style: styleSelect.value,
          radius: radiusSlider.value,
          autoWb: autoWbToggle.checked,
          maxSizeOn: maxSizeToggle.checked,
          maxSizeValue: maxSizeValue.value,
          maxSizeUnit: maxSizeUnit.value,
        })
      );
    } catch (err) {
      // ignore -- no persistence this session, nothing else changes
    }
  }

  function loadSettings() {
    let s;
    try {
      const raw = localStorage.getItem(SETTINGS_KEY);
      if (!raw) return;
      s = JSON.parse(raw);
    } catch (err) {
      return;
    }
    if (!s || typeof s !== "object") return;

    if (s.aspect) aspectSelect.value = s.aspect;
    if (s.width) {
      widthSlider.value = s.width;
      widthValue.textContent = `${widthSlider.value}%`;
    }
    if (s.color) colorInput.value = s.color;
    if (s.style) styleSelect.value = s.style;
    if (s.radius !== undefined) {
      radiusSlider.value = s.radius;
      radiusValue.textContent = radiusSlider.value;
    }
    autoWbToggle.checked = !!s.autoWb;
    maxSizeToggle.checked = !!s.maxSizeOn;
    maxSizeValue.disabled = !maxSizeToggle.checked;
    maxSizeUnit.disabled = !maxSizeToggle.checked;
    if (s.maxSizeValue) maxSizeValue.value = s.maxSizeValue;
    if (s.maxSizeUnit) maxSizeUnit.value = s.maxSizeUnit;
  }

  // Undo/redo: covers everything that visually changes the photo (frame,
  // color, auto WB, quick edits) so a heavy-handed slider drag can be
  // walked back one step at a time, same as any other editor. Deliberately
  // excludes the max-size download limit, since that doesn't affect what
  // the photo looks like.
  //
  // A step is recorded on "change" (when a drag/selection is committed),
  // not "input" (which fires continuously while dragging) -- otherwise a
  // single slider drag would create dozens of undo steps instead of one.
  let undoStack = [];
  let redoStack = [];
  let isRestoringHistory = false;

  function captureState() {
    return {
      aspect: aspectSelect.value,
      width: widthSlider.value,
      color: colorInput.value,
      style: styleSelect.value,
      radius: radiusSlider.value,
      autoWb: autoWbToggle.checked,
      brightness: brightnessSlider.value,
      saturation: saturationSlider.value,
      curve: curveSlider.value,
      cropRect: cropRect ? { ...cropRect } : null,
      rotation,
      flipH,
      flipV,
      fineRotation,
    };
  }

  function applyState(s) {
    aspectSelect.value = s.aspect;
    widthSlider.value = s.width;
    widthValue.textContent = `${s.width}%`;
    colorInput.value = s.color;
    styleSelect.value = s.style;
    radiusSlider.value = s.radius;
    radiusValue.textContent = s.radius;
    autoWbToggle.checked = s.autoWb;
    brightnessSlider.value = s.brightness;
    brightnessValue.textContent = s.brightness;
    saturationSlider.value = s.saturation;
    saturationValue.textContent = s.saturation;
    curveSlider.value = s.curve;
    curveValue.textContent = s.curve;
    cropRect = s.cropRect ? { ...s.cropRect } : null;
    rotation = s.rotation;
    flipH = s.flipH;
    flipV = s.flipV;
    fineRotation = s.fineRotation || 0;
    fineRotateSlider.value = String(fineRotation);
    fineRotateValue.textContent = `${fineRotation}°`;
    rotatedFullCanvas = null;
    rotatedFullKey = null;
    updateCropUiVisibility();
    render();
  }

  function updateUndoRedoButtons() {
    undoBtn.disabled = undoStack.length < 2;
    redoBtn.disabled = redoStack.length === 0;
  }

  // Call after any committed change (a "change" event, a swatch click, the
  // quick-edits Reset button). Starts a fresh history for the current
  // photo if this is the first call since it loaded.
  function pushHistory() {
    if (isRestoringHistory) return;
    undoStack.push(captureState());
    if (undoStack.length > 50) undoStack.shift(); // cap memory use
    redoStack = [];
    updateUndoRedoButtons();
  }

  function resetHistory() {
    undoStack = [captureState()];
    redoStack = [];
    updateUndoRedoButtons();
  }

  function undo() {
    if (cropAdjusting || undoStack.length < 2) return;
    redoStack.push(undoStack.pop());
    isRestoringHistory = true;
    applyState(undoStack[undoStack.length - 1]);
    isRestoringHistory = false;
    updateUndoRedoButtons();
    saveSettings();
  }

  function redo() {
    if (cropAdjusting || redoStack.length === 0) return;
    const next = redoStack.pop();
    undoStack.push(next);
    isRestoringHistory = true;
    applyState(next);
    isRestoringHistory = false;
    updateUndoRedoButtons();
    saveSettings();
  }

  undoBtn.addEventListener("click", undo);
  redoBtn.addEventListener("click", redo);

  document.addEventListener("keydown", (e) => {
    if (!editor.hidden && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
      e.preventDefault();
      if (e.shiftKey) redo();
      else undo();
    }
  });

  widthSlider.addEventListener("input", () => {
    widthValue.textContent = `${widthSlider.value}%`;
    scheduleRender();
    saveSettings();
  });
  widthSlider.addEventListener("change", pushHistory);

  radiusSlider.addEventListener("input", () => {
    radiusValue.textContent = radiusSlider.value;
    scheduleRender();
    saveSettings();
  });
  radiusSlider.addEventListener("change", pushHistory);

  colorInput.addEventListener("input", () => {
    scheduleRender();
    saveSettings();
  });
  colorInput.addEventListener("change", pushHistory);

  styleSelect.addEventListener("change", () => {
    scheduleRender();
    saveSettings();
    pushHistory();
  });
  aspectSelect.addEventListener("change", () => {
    scheduleRender();
    saveSettings();
    pushHistory();
  });

  autoWbToggle.addEventListener("change", () => {
    scheduleRender();
    saveSettings();
    pushHistory();
  });

  brightnessSlider.addEventListener("input", () => {
    brightnessValue.textContent = brightnessSlider.value;
    scheduleRender();
  });
  brightnessSlider.addEventListener("change", pushHistory);

  saturationSlider.addEventListener("input", () => {
    saturationValue.textContent = saturationSlider.value;
    scheduleRender();
  });
  saturationSlider.addEventListener("change", pushHistory);

  curveSlider.addEventListener("input", () => {
    curveValue.textContent = curveSlider.value;
    scheduleRender();
  });
  curveSlider.addEventListener("change", pushHistory);

  resetEditsBtn.addEventListener("click", () => {
    brightnessSlider.value = "0";
    saturationSlider.value = "0";
    curveSlider.value = "0";
    brightnessValue.textContent = "0";
    saturationValue.textContent = "0";
    curveValue.textContent = "0";
    scheduleRender();
    pushHistory();
  });

  rotateBtn.addEventListener("click", () => {
    rotation = (rotation + 90) % 360;
    cropRect = null;
    updateCropUiVisibility();
    render();
    pushHistory();
  });

  flipHBtn.addEventListener("click", () => {
    flipH = !flipH;
    cropRect = null;
    updateCropUiVisibility();
    render();
    pushHistory();
  });

  flipVBtn.addEventListener("click", () => {
    flipV = !flipV;
    cropRect = null;
    updateCropUiVisibility();
    render();
    pushHistory();
  });

  fineRotateSlider.addEventListener("input", () => {
    fineRotation = parseFloat(fineRotateSlider.value);
    fineRotateValue.textContent = `${fineRotation}°`;
    scheduleRender();
  });
  fineRotateSlider.addEventListener("change", pushHistory);
  fineRotateSlider.addEventListener("dblclick", () => {
    fineRotateSlider.value = "0";
    fineRotation = 0;
    fineRotateValue.textContent = "0°";
    render();
    pushHistory();
  });
  // Show the reference grid for as long as the slider is engaged -- covers
  // a mouse/touch drag and keyboard arrow-key adjustment alike, since both
  // focus the input first.
  fineRotateSlider.addEventListener("focus", () => {
    straightenGridFocused = true;
    render();
  });
  fineRotateSlider.addEventListener("blur", () => {
    straightenGridFocused = false;
    render();
  });

  swatches.addEventListener("click", (e) => {
    const btn = e.target.closest(".swatch");
    if (!btn) return;
    colorInput.value = btn.dataset.color;
    render();
    saveSettings();
    pushHistory();
  });

  maxSizeToggle.addEventListener("change", () => {
    maxSizeValue.disabled = !maxSizeToggle.checked;
    maxSizeUnit.disabled = !maxSizeToggle.checked;
    saveSettings();
  });
  maxSizeValue.addEventListener("input", saveSettings);
  maxSizeUnit.addEventListener("change", saveSettings);

  loadSettings();

  function canvasToBlob(sourceCanvas, mimeType, quality) {
    return new Promise((resolve) => sourceCanvas.toBlob(resolve, mimeType, quality));
  }

  function formatBytes(bytes) {
    if (bytes >= 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(2) + " MB";
    if (bytes >= 1024) return Math.round(bytes / 1024) + " KB";
    return Math.round(bytes) + " bytes";
  }

  function makeScaledCanvas(sourceCanvas, scale) {
    const scaled = document.createElement("canvas");
    scaled.width = Math.max(1, Math.round(sourceCanvas.width * scale));
    scaled.height = Math.max(1, Math.round(sourceCanvas.height * scale));
    const sctx = scaled.getContext("2d");
    sctx.imageSmoothingEnabled = true;
    sctx.imageSmoothingQuality = "high";
    sctx.drawImage(sourceCanvas, 0, 0, scaled.width, scaled.height);
    return scaled;
  }

  const MIN_LOSSLESS_SCALE = 0.05;

  // Strategy, in order of preference (best quality first):
  //  1. Full-resolution PNG (lossless) -- use it if it already fits.
  //  2. A smaller PNG (still lossless -- no compression artifacts, just
  //     fewer pixels). Binary-search the largest scale that still fits.
  //  3. Only if even a tiny PNG doesn't fit under the limit, fall back to
  //     JPEG at that smallest scale, using the highest quality that fits
  //     (this is the only path that can introduce real compression
  //     artifacts, and it only kicks in for extremely tight limits).
  async function exportUnderSizeLimit(maxBytes) {
    const fullPng = await canvasToBlob(canvas, "image/png");
    if (fullPng.size <= maxBytes) {
      return { blob: fullPng, ext: "png", method: "original" };
    }

    const smallestPng = await canvasToBlob(makeScaledCanvas(canvas, MIN_LOSSLESS_SCALE), "image/png");
    if (smallestPng.size <= maxBytes) {
      // Binary-search for the largest scale, between our smallest-tried
      // scale and full size, whose lossless PNG still fits.
      let lo = MIN_LOSSLESS_SCALE;
      let hi = 1;
      let bestScale = lo;
      let bestBlob = smallestPng;
      for (let i = 0; i < 8; i++) {
        const mid = (lo + hi) / 2;
        const candidate = await canvasToBlob(makeScaledCanvas(canvas, mid), "image/png");
        if (candidate.size <= maxBytes) {
          bestScale = mid;
          bestBlob = candidate;
          lo = mid;
        } else {
          hi = mid;
        }
      }
      return { blob: bestBlob, ext: "png", method: "resized-lossless", scale: bestScale };
    }

    // Even the smallest lossless PNG doesn't fit -- lossy JPEG is the only
    // way left to hit this limit. Maximize quality at that same small size.
    const tinyCanvas = makeScaledCanvas(canvas, MIN_LOSSLESS_SCALE);
    let lo = 0.05;
    let hi = 0.95;
    const lowestJpeg = await canvasToBlob(tinyCanvas, "image/jpeg", lo);
    if (lowestJpeg.size > maxBytes) {
      return { blob: lowestJpeg, ext: "jpg", method: "jpeg-fallback", gaveUp: true };
    }
    let best = lowestJpeg;
    for (let i = 0; i < 7; i++) {
      const mid = (lo + hi) / 2;
      const candidate = await canvasToBlob(tinyCanvas, "image/jpeg", mid);
      if (candidate.size <= maxBytes) {
        best = candidate;
        lo = mid;
      } else {
        hi = mid;
      }
    }
    return { blob: best, ext: "jpg", method: "jpeg-fallback" };
  }

  function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  downloadBtn.addEventListener("click", async () => {
    statusLine.hidden = true;

    if (!maxSizeToggle.checked) {
      const blob = await canvasToBlob(canvas, "image/png");
      triggerDownload(blob, `${currentFileBaseName}-bordered.png`);
      return;
    }

    const value = parseFloat(maxSizeValue.value) || 0;
    const unit = maxSizeUnit.value;
    const maxBytes = Math.max(1, Math.round(value * (unit === "MB" ? 1024 * 1024 : 1024)));

    downloadBtn.disabled = true;
    const originalLabel = downloadBtn.textContent;
    downloadBtn.textContent = "Working…";

    try {
      const { blob, ext, method, scale, gaveUp } = await exportUnderSizeLimit(maxBytes);
      triggerDownload(blob, `${currentFileBaseName}-bordered.${ext}`);

      statusLine.hidden = false;
      if (gaveUp) {
        statusLine.textContent = `Even heavy JPEG compression couldn't get under ${formatBytes(maxBytes)} — saved the smallest possible version at ${formatBytes(blob.size)} instead.`;
      } else if (method === "resized-lossless") {
        const pct = Math.round(scale * 100);
        statusLine.textContent = `Saved at ${formatBytes(blob.size)} — resized to ${pct}% to fit under ${formatBytes(maxBytes)}. Still a lossless PNG, so no compression artifacts, just fewer pixels.`;
      } else if (method === "jpeg-fallback") {
        statusLine.textContent = `Saved at ${formatBytes(blob.size)} — even resized, a lossless PNG couldn't fit under ${formatBytes(maxBytes)}, so this was converted to JPEG at the highest quality that still fits. Some quality loss is unavoidable at this size.`;
      } else {
        statusLine.textContent = `Saved at ${formatBytes(blob.size)}.`;
      }
    } finally {
      downloadBtn.disabled = false;
      downloadBtn.textContent = originalLabel;
    }
  });

  resetBtn.addEventListener("click", () => {
    currentImage = null;
    fileInput.value = "";
    editor.hidden = true;
    dropZone.hidden = false;
    dropZone.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  // Desktop/mobile layout mode -- auto-detected on first visit (see the
  // inline script in <head> that sets the class before paint to avoid a
  // flash of the wrong layout), then remembered once the person taps the
  // toggle so it doesn't need re-picking every time.
  const uiModeToggleBtn = document.getElementById("ui-mode-toggle");
  const UI_MODE_KEY = "borderToolUiMode";

  function getUiMode() {
    return document.documentElement.classList.contains("ui-desktop") ? "desktop" : "mobile";
  }

  // Same stroke-icon convention as the rest of the toolbar (24x24, round
  // caps/joins, currentColor) instead of the phone/desktop emoji, so this
  // button doesn't look like a different, unrelated UI system.
  const UI_MODE_ICON_MOBILE =
    '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2.2" /><path d="M10.5 18h3" /></svg>';
  const UI_MODE_ICON_DESKTOP =
    '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12.5" rx="1.5" /><path d="M8.5 20.5h7" /><path d="M12 16.5v4" /></svg>';

  function updateUiModeToggleLabel() {
    const mode = getUiMode();
    uiModeToggleBtn.innerHTML = mode === "desktop" ? UI_MODE_ICON_DESKTOP : UI_MODE_ICON_MOBILE;
    uiModeToggleBtn.title = mode === "desktop" ? "Desktop layout (tap for mobile)" : "Mobile layout (tap for desktop)";
  }

  function setUiMode(mode) {
    document.documentElement.classList.remove("ui-mobile", "ui-desktop");
    document.documentElement.classList.add("ui-" + mode);
    try {
      localStorage.setItem(UI_MODE_KEY, mode);
    } catch (e) {}
    updateUiModeToggleLabel();
  }

  uiModeToggleBtn.addEventListener("click", () => {
    setUiMode(getUiMode() === "desktop" ? "mobile" : "desktop");
  });

  updateUiModeToggleLabel();
})();

// Offline support: registers sw.js (a separate file next to this one) so
// the tool keeps working with no signal after it's been opened at least
// once online. Silently does nothing if sw.js isn't present yet (e.g. you
// haven't uploaded it to the repo) or the page was opened as a local
// file, so it's safe either way.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
  </script>
</body>
</html>
