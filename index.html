<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Border It</title>
<meta name="theme-color" content="#1b1b1f" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect x=%2210%22 y=%2210%22 width=%2280%22 height=%2280%22 fill=%22none%22 stroke=%22%23e8734a%22 stroke-width=%2212%22/></svg>" />
<style>
:root {
  color-scheme: dark;
  --bg: #1b1b1f;
  --panel: #26262c;
  --panel-2: #303038;
  --text: #f2f1ee;
  --muted: #a8a7b3;
  --accent: #e8734a;
  --border: #3a3a42;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  min-height: 100%;
}

body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

.app-header {
  text-align: center;
  padding: 24px 16px 8px;
}

.app-header h1 {
  margin: 0;
  font-size: 1.6rem;
  letter-spacing: -0.02em;
}

.tagline {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 0.9rem;
}

main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px;
  gap: 16px;
  width: 100%;
}

.drop-zone {
  width: 100%;
  max-width: 480px;
  border: 2px dashed var(--border);
  border-radius: 16px;
  background: var(--panel);
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease;
}

.drop-zone:hover,
.drop-zone.drag-over {
  border-color: var(--accent);
  background: var(--panel-2);
}

.drop-zone-inner {
  padding: 48px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  text-align: center;
}

.drop-zone-inner svg {
  color: var(--accent);
  margin-bottom: 4px;
}

.drop-zone-inner p {
  margin: 0;
}

.drop-zone-inner strong {
  color: var(--text);
}

.hint {
  font-size: 0.85rem;
}

.editor {
  width: 100%;
  max-width: 640px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.editor[hidden],
.drop-zone[hidden] {
  display: none;
}

.canvas-wrap {
  width: 100%;
  display: flex;
  justify-content: center;
  background: repeating-conic-gradient(#2a2a30 0% 25%, #232328 0% 50%) 50% / 24px 24px;
  border-radius: 12px;
  padding: 12px;
}

#canvas {
  max-width: 100%;
  max-height: 60vh;
  border-radius: 4px;
  display: block;
}

.controls {
  background: var(--panel);
  border-radius: 16px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.control-row {
  display: grid;
  grid-template-columns: 64px 1fr auto;
  align-items: center;
  gap: 12px;
}

.control-row label {
  font-size: 0.9rem;
  color: var(--muted);
}

.control-row select,
.control-row input[type="color"] {
  width: 100%;
  height: 36px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--panel-2);
  color: var(--text);
}

.control-row input[type="color"] {
  padding: 2px;
  width: 44px;
  flex: none;
}

.control-row:has(#border-color) {
  grid-template-columns: 64px auto 1fr;
}

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
  outline: none;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: none;
}

input[type="range"]::-moz-range-thumb {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: none;
}

.value-pill {
  font-variant-numeric: tabular-nums;
  color: var(--text);
  font-size: 0.85rem;
  min-width: 40px;
  text-align: right;
}

.swatches {
  display: flex;
  gap: 8px;
  justify-self: end;
}

.swatch {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid var(--border);
  padding: 0;
  cursor: pointer;
}

.swatch:hover {
  border-color: var(--accent);
}

.button-row {
  display: flex;
  gap: 12px;
  margin-top: 4px;
}

.primary-btn,
.secondary-btn {
  flex: 1;
  padding: 14px 16px;
  border-radius: 12px;
  border: none;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
}

.primary-btn {
  background: var(--accent);
  color: #1b1408;
}

.primary-btn:active {
  opacity: 0.85;
}

.secondary-btn {
  background: var(--panel-2);
  color: var(--text);
  border: 1px solid var(--border);
}

.section-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 4px;
}

.section-title-row:first-child {
  margin-top: 0;
}

.section-title {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  font-weight: 600;
}

.text-btn {
  background: none;
  border: none;
  color: var(--accent);
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  padding: 4px 2px;
}

.text-btn:active {
  opacity: 0.7;
}

.size-limit-inputs {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.checkbox-label {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text);
  font-size: 0.9rem;
  white-space: nowrap;
}

.checkbox-label input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: var(--accent);
}

#max-size-value {
  width: 64px;
  height: 36px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--panel-2);
  color: var(--text);
  padding: 0 8px;
}

#max-size-unit {
  height: 36px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--panel-2);
  color: var(--text);
  width: 70px;
}

#max-size-value:disabled,
#max-size-unit:disabled {
  opacity: 0.5;
}

.status-line {
  margin: 0;
  text-align: center;
  font-size: 0.85rem;
  color: var(--muted);
}

.app-footer {
  text-align: center;
  padding: 16px;
  color: var(--muted);
  font-size: 0.8rem;
}

@media (min-width: 700px) {
  .app-header h1 {
    font-size: 2rem;
  }
}
</style>
</head>
<body>
  <header class="app-header">
    <h1>Border It</h1>
    <p class="tagline">Add a border to a photo, right from your phone.</p>
  </header>

  <main>
    <section id="drop-zone" class="drop-zone">
      <input type="file" id="file-input" accept="image/*" hidden />
      <div class="drop-zone-inner" id="drop-zone-inner">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" />
          <path d="M7 9l5-5 5 5" />
          <path d="M12 4v13" />
        </svg>
        <p><strong>Tap to choose a photo</strong></p>
        <p class="hint">or drag one in</p>
      </div>
    </section>

    <section id="editor" class="editor" hidden>
      <div class="canvas-wrap">
        <canvas id="canvas"></canvas>
      </div>

      <div class="controls">
        <div class="section-title-row">
          <span class="section-title">Quick edits</span>
          <button type="button" id="reset-edits-btn" class="text-btn">Reset</button>
        </div>

        <div class="control-row">
          <label for="brightness">Bright</label>
          <input type="range" id="brightness" min="-100" max="100" value="0" step="1" />
          <span class="value-pill" id="brightness-value">0</span>
        </div>

        <div class="control-row">
          <label for="saturation">Vivid</label>
          <input type="range" id="saturation" min="-100" max="100" value="0" step="1" />
          <span class="value-pill" id="saturation-value">0</span>
        </div>

        <div class="control-row">
          <label for="s-curve">S-Curve</label>
          <input type="range" id="s-curve" min="0" max="100" value="0" step="1" />
          <span class="value-pill" id="s-curve-value">0</span>
        </div>

        <div class="section-title-row">
          <span class="section-title">Frame</span>
        </div>

        <div class="control-row">
          <label for="aspect-ratio">Ratio</label>
          <select id="aspect-ratio">
            <option value="original">Original</option>
            <option value="1:1">Square 1:1</option>
            <option value="4:5">Portrait 4:5</option>
            <option value="3:4">Portrait 3:4</option>
            <option value="9:16">Portrait 9:16</option>
            <option value="5:4">Landscape 5:4</option>
            <option value="4:3">Landscape 4:3</option>
            <option value="3:2">Landscape 3:2</option>
            <option value="16:9">Landscape 16:9</option>
          </select>
        </div>

        <div class="control-row">
          <label for="border-width">Width</label>
          <input type="range" id="border-width" min="0" max="25" value="6" step="0.5" />
          <span class="value-pill" id="border-width-value">6%</span>
        </div>

        <div class="control-row">
          <label for="border-color">Color</label>
          <input type="color" id="border-color" value="#ffffff" />
          <div class="swatches" id="swatches">
            <button type="button" class="swatch" style="background:#ffffff" data-color="#ffffff" aria-label="White"></button>
            <button type="button" class="swatch" style="background:#000000" data-color="#000000" aria-label="Black"></button>
            <button type="button" class="swatch" style="background:#e8734a" data-color="#e8734a" aria-label="Orange"></button>
            <button type="button" class="swatch" style="background:#2f6f4f" data-color="#2f6f4f" aria-label="Green"></button>
            <button type="button" class="swatch" style="background:#274b8e" data-color="#274b8e" aria-label="Blue"></button>
          </div>
        </div>

        <div class="control-row">
          <label for="border-style">Style</label>
          <select id="border-style">
            <option value="even">Even</option>
            <option value="polaroid">Polaroid (thick bottom)</option>
          </select>
        </div>

        <div class="control-row">
          <label for="corner-radius">Corners</label>
          <input type="range" id="corner-radius" min="0" max="60" value="0" step="1" />
          <span class="value-pill" id="corner-radius-value">0</span>
        </div>

        <div class="control-row size-limit-row">
          <label for="max-size-toggle">Max size</label>
          <div class="size-limit-inputs">
            <label class="checkbox-label">
              <input type="checkbox" id="max-size-toggle" />
              Limit to
            </label>
            <input type="number" id="max-size-value" min="0.1" step="0.1" value="2" disabled />
            <select id="max-size-unit" disabled>
              <option value="MB" selected>MB</option>
              <option value="KB">KB</option>
            </select>
          </div>
        </div>

        <div class="button-row">
          <button type="button" id="download-btn" class="primary-btn">Download</button>
          <button type="button" id="reset-btn" class="secondary-btn">Choose another photo</button>
        </div>

        <p class="status-line" id="status-line" hidden></p>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <p>Runs entirely in your browser — nothing is uploaded anywhere.</p>
  </footer>

  <script>
(() => {
  "use strict";

  const fileInput = document.getElementById("file-input");
  const dropZone = document.getElementById("drop-zone");
  const editor = document.getElementById("editor");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const aspectSelect = document.getElementById("aspect-ratio");
  const widthSlider = document.getElementById("border-width");
  const widthValue = document.getElementById("border-width-value");
  const colorInput = document.getElementById("border-color");
  const swatches = document.getElementById("swatches");
  const styleSelect = document.getElementById("border-style");
  const radiusSlider = document.getElementById("corner-radius");
  const radiusValue = document.getElementById("corner-radius-value");
  const downloadBtn = document.getElementById("download-btn");
  const resetBtn = document.getElementById("reset-btn");
  const maxSizeToggle = document.getElementById("max-size-toggle");
  const maxSizeValue = document.getElementById("max-size-value");
  const maxSizeUnit = document.getElementById("max-size-unit");
  const statusLine = document.getElementById("status-line");

  const brightnessSlider = document.getElementById("brightness");
  const brightnessValue = document.getElementById("brightness-value");
  const saturationSlider = document.getElementById("saturation");
  const saturationValue = document.getElementById("saturation-value");
  const curveSlider = document.getElementById("s-curve");
  const curveValue = document.getElementById("s-curve-value");
  const resetEditsBtn = document.getElementById("reset-edits-btn");

  let currentImage = null;
  let currentFileBaseName = "photo";

  // Cache of the photo with brightness/saturation/S-curve baked in, so those
  // (relatively expensive, per-pixel) adjustments are only recomputed when
  // they actually change -- not on every render triggered by an unrelated
  // control like border width or color.
  let adjustedPhotoCanvas = null;
  let adjustedPhotoKey = null;

  // Coalesce rapid slider "input" events (e.g. dragging) into at most one
  // render per animation frame.
  let renderScheduled = false;
  function scheduleRender() {
    if (renderScheduled) return;
    renderScheduled = true;
    requestAnimationFrame(() => {
      renderScheduled = false;
      render();
    });
  }

  function openFilePicker() {
    fileInput.click();
  }

  dropZone.addEventListener("click", openFilePicker);

  ["dragenter", "dragover"].forEach((evt) => {
    dropZone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropZone.classList.add("drag-over");
    });
  });

  ["dragleave", "drop"].forEach((evt) => {
    dropZone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropZone.classList.remove("drag-over");
    });
  });

  dropZone.addEventListener("drop", (e) => {
    const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) loadFile(file);
  });

  fileInput.addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0];
    if (file) loadFile(file);
  });

  function loadFile(file) {
    if (!file.type.startsWith("image/")) return;
    currentFileBaseName = (file.name || "photo").replace(/\.[^.]+$/, "") || "photo";

    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        currentImage = img;
        adjustedPhotoCanvas = null;
        adjustedPhotoKey = null;
        editor.hidden = false;
        dropZone.hidden = true;
        render();
        editor.scrollIntoView({ behavior: "smooth", block: "start" });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function roundedRectPath(context, x, y, w, h, r) {
    const radius = Math.max(0, Math.min(r, w / 2, h / 2));
    context.beginPath();
    if (context.roundRect) {
      context.roundRect(x, y, w, h, radius);
    } else {
      context.moveTo(x + radius, y);
      context.arcTo(x + w, y, x + w, y + h, radius);
      context.arcTo(x + w, y + h, x, y + h, radius);
      context.arcTo(x, y + h, x, y, radius);
      context.arcTo(x, y, x + w, y, radius);
    }
    context.closePath();
  }

  // Given the bordered photo's own size (innerW x innerH), find the smallest
  // canvas with the requested aspect ratio that fully contains it -- so the
  // photo is never cropped, only padded (letterboxed/pillarboxed) to reach
  // that shape, centered.
  function getPaddedCanvasSize(innerW, innerH, ratioValue) {
    if (ratioValue === "original") {
      return { canvasW: innerW, canvasH: innerH };
    }

    const [rw, rh] = ratioValue.split(":").map(Number);
    const targetRatio = rw / rh;

    let canvasW, canvasH;
    if (innerW / targetRatio > innerH) {
      canvasW = innerW;
      canvasH = innerW / targetRatio;
    } else {
      canvasH = innerH;
      canvasW = innerH * targetRatio;
    }

    return { canvasW: Math.round(canvasW), canvasH: Math.round(canvasH) };
  }

  function clamp8(v) {
    return v < 0 ? 0 : v > 255 ? 255 : v;
  }

  // 256-entry lookup table combining a brightness offset with an S-curve
  // (a smoothstep blend: gentle near black/white, steeper through the
  // midtones -- the classic photo-editing "pop" curve). curveAmount is
  // 0 (no effect) to 1 (full curve); kept in that range so the result
  // stays monotonic (no posterization/inversion artifacts).
  function buildToneLUT(brightness, curveAmount) {
    const lut = new Uint8ClampedArray(256);
    for (let i = 0; i < 256; i++) {
      const withBrightness = clamp8(i + brightness);
      const x = withBrightness / 255;
      const smoothstep = x * x * (3 - 2 * x);
      const y = x + curveAmount * (smoothstep - x);
      lut[i] = Math.round(clamp8(y * 255));
    }
    return lut;
  }

  // Returns a canvas containing just the photo (no border/padding) with
  // brightness, saturation, and S-curve baked in. Cached and only
  // recomputed when the adjustment values (or the photo itself) change.
  function getAdjustedPhotoCanvas(imgW, imgH) {
    const brightness = parseInt(brightnessSlider.value, 10);
    const saturation = parseInt(saturationSlider.value, 10);
    const curveAmount = parseInt(curveSlider.value, 10) / 100;
    const key = `${brightness}|${saturation}|${curveAmount}|${imgW}x${imgH}`;

    if (adjustedPhotoCanvas && adjustedPhotoKey === key) {
      return adjustedPhotoCanvas;
    }

    const photoCanvas = document.createElement("canvas");
    photoCanvas.width = imgW;
    photoCanvas.height = imgH;
    const pctx = photoCanvas.getContext("2d");
    pctx.drawImage(currentImage, 0, 0, imgW, imgH);

    if (brightness !== 0 || saturation !== 0 || curveAmount !== 0) {
      const lut = buildToneLUT(brightness, curveAmount);
      const satFactor = 1 + saturation / 100;
      const imageData = pctx.getImageData(0, 0, imgW, imgH);
      const data = imageData.data;

      for (let i = 0; i < data.length; i += 4) {
        let r = lut[data[i]];
        let g = lut[data[i + 1]];
        let b = lut[data[i + 2]];

        if (saturation !== 0) {
          const lum = 0.299 * r + 0.587 * g + 0.114 * b;
          r = lum + (r - lum) * satFactor;
          g = lum + (g - lum) * satFactor;
          b = lum + (b - lum) * satFactor;
        }

        data[i] = clamp8(r);
        data[i + 1] = clamp8(g);
        data[i + 2] = clamp8(b);
      }

      pctx.putImageData(imageData, 0, 0);
    }

    adjustedPhotoCanvas = photoCanvas;
    adjustedPhotoKey = key;
    return photoCanvas;
  }

  function render() {
    if (!currentImage) return;

    const imgW = currentImage.naturalWidth;
    const imgH = currentImage.naturalHeight;
    const shortSide = Math.min(imgW, imgH);

    const widthPct = parseFloat(widthSlider.value);
    const style = styleSelect.value;
    const color = colorInput.value;
    const radiusPct = parseFloat(radiusSlider.value);

    const baseBorder = Math.round((widthPct / 100) * shortSide);

    let top = baseBorder;
    let left = baseBorder;
    let right = baseBorder;
    let bottom = baseBorder;

    if (style === "polaroid") {
      bottom = Math.round(baseBorder * 2.6) + (baseBorder === 0 ? Math.round(shortSide * 0.08) : 0);
    }

    const innerW = imgW + left + right;
    const innerH = imgH + top + bottom;

    const { canvasW, canvasH } = getPaddedCanvasSize(innerW, innerH, aspectSelect.value);

    canvas.width = canvasW;
    canvas.height = canvasH;

    // corner radius scales with the shorter output side
    const radius = Math.round((radiusPct / 100) * Math.min(canvasW, canvasH) * 0.5);

    ctx.clearRect(0, 0, canvasW, canvasH);
    ctx.save();
    roundedRectPath(ctx, 0, 0, canvasW, canvasH, radius);
    ctx.clip();

    ctx.fillStyle = color;
    ctx.fillRect(0, 0, canvasW, canvasH);

    // center the (photo + its own border frame) box within the canvas
    const offsetX = Math.round((canvasW - innerW) / 2);
    const offsetY = Math.round((canvasH - innerH) / 2);

    const adjustedPhoto = getAdjustedPhotoCanvas(imgW, imgH);
    ctx.drawImage(adjustedPhoto, offsetX + left, offsetY + top, imgW, imgH);
    ctx.restore();
  }

  widthSlider.addEventListener("input", () => {
    widthValue.textContent = `${widthSlider.value}%`;
    scheduleRender();
  });

  radiusSlider.addEventListener("input", () => {
    radiusValue.textContent = radiusSlider.value;
    scheduleRender();
  });

  colorInput.addEventListener("input", scheduleRender);
  styleSelect.addEventListener("change", scheduleRender);
  aspectSelect.addEventListener("change", scheduleRender);

  brightnessSlider.addEventListener("input", () => {
    brightnessValue.textContent = brightnessSlider.value;
    scheduleRender();
  });

  saturationSlider.addEventListener("input", () => {
    saturationValue.textContent = saturationSlider.value;
    scheduleRender();
  });

  curveSlider.addEventListener("input", () => {
    curveValue.textContent = curveSlider.value;
    scheduleRender();
  });

  resetEditsBtn.addEventListener("click", () => {
    brightnessSlider.value = "0";
    saturationSlider.value = "0";
    curveSlider.value = "0";
    brightnessValue.textContent = "0";
    saturationValue.textContent = "0";
    curveValue.textContent = "0";
    scheduleRender();
  });

  swatches.addEventListener("click", (e) => {
    const btn = e.target.closest(".swatch");
    if (!btn) return;
    colorInput.value = btn.dataset.color;
    render();
  });

  maxSizeToggle.addEventListener("change", () => {
    maxSizeValue.disabled = !maxSizeToggle.checked;
    maxSizeUnit.disabled = !maxSizeToggle.checked;
  });

  function canvasToBlob(sourceCanvas, mimeType, quality) {
    return new Promise((resolve) => sourceCanvas.toBlob(resolve, mimeType, quality));
  }

  function formatBytes(bytes) {
    if (bytes >= 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(2) + " MB";
    if (bytes >= 1024) return Math.round(bytes / 1024) + " KB";
    return Math.round(bytes) + " bytes";
  }

  function makeScaledCanvas(sourceCanvas, scale) {
    const scaled = document.createElement("canvas");
    scaled.width = Math.max(1, Math.round(sourceCanvas.width * scale));
    scaled.height = Math.max(1, Math.round(sourceCanvas.height * scale));
    const sctx = scaled.getContext("2d");
    sctx.imageSmoothingEnabled = true;
    sctx.imageSmoothingQuality = "high";
    sctx.drawImage(sourceCanvas, 0, 0, scaled.width, scaled.height);
    return scaled;
  }

  const MIN_LOSSLESS_SCALE = 0.05;

  // Strategy, in order of preference (best quality first):
  //  1. Full-resolution PNG (lossless) -- use it if it already fits.
  //  2. A smaller PNG (still lossless -- no compression artifacts, just
  //     fewer pixels). Binary-search the largest scale that still fits.
  //  3. Only if even a tiny PNG doesn't fit under the limit, fall back to
  //     JPEG at that smallest scale, using the highest quality that fits
  //     (this is the only path that can introduce real compression
  //     artifacts, and it only kicks in for extremely tight limits).
  async function exportUnderSizeLimit(maxBytes) {
    const fullPng = await canvasToBlob(canvas, "image/png");
    if (fullPng.size <= maxBytes) {
      return { blob: fullPng, ext: "png", method: "original" };
    }

    const smallestPng = await canvasToBlob(makeScaledCanvas(canvas, MIN_LOSSLESS_SCALE), "image/png");
    if (smallestPng.size <= maxBytes) {
      // Binary-search for the largest scale, between our smallest-tried
      // scale and full size, whose lossless PNG still fits.
      let lo = MIN_LOSSLESS_SCALE;
      let hi = 1;
      let bestScale = lo;
      let bestBlob = smallestPng;
      for (let i = 0; i < 8; i++) {
        const mid = (lo + hi) / 2;
        const candidate = await canvasToBlob(makeScaledCanvas(canvas, mid), "image/png");
        if (candidate.size <= maxBytes) {
          bestScale = mid;
          bestBlob = candidate;
          lo = mid;
        } else {
          hi = mid;
        }
      }
      return { blob: bestBlob, ext: "png", method: "resized-lossless", scale: bestScale };
    }

    // Even the smallest lossless PNG doesn't fit -- lossy JPEG is the only
    // way left to hit this limit. Maximize quality at that same small size.
    const tinyCanvas = makeScaledCanvas(canvas, MIN_LOSSLESS_SCALE);
    let lo = 0.05;
    let hi = 0.95;
    const lowestJpeg = await canvasToBlob(tinyCanvas, "image/jpeg", lo);
    if (lowestJpeg.size > maxBytes) {
      return { blob: lowestJpeg, ext: "jpg", method: "jpeg-fallback", gaveUp: true };
    }
    let best = lowestJpeg;
    for (let i = 0; i < 7; i++) {
      const mid = (lo + hi) / 2;
      const candidate = await canvasToBlob(tinyCanvas, "image/jpeg", mid);
      if (candidate.size <= maxBytes) {
        best = candidate;
        lo = mid;
      } else {
        hi = mid;
      }
    }
    return { blob: best, ext: "jpg", method: "jpeg-fallback" };
  }

  function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  downloadBtn.addEventListener("click", async () => {
    statusLine.hidden = true;

    if (!maxSizeToggle.checked) {
      const blob = await canvasToBlob(canvas, "image/png");
      triggerDownload(blob, `${currentFileBaseName}-bordered.png`);
      return;
    }

    const value = parseFloat(maxSizeValue.value) || 0;
    const unit = maxSizeUnit.value;
    const maxBytes = Math.max(1, Math.round(value * (unit === "MB" ? 1024 * 1024 : 1024)));

    downloadBtn.disabled = true;
    const originalLabel = downloadBtn.textContent;
    downloadBtn.textContent = "Working…";

    try {
      const { blob, ext, method, scale, gaveUp } = await exportUnderSizeLimit(maxBytes);
      triggerDownload(blob, `${currentFileBaseName}-bordered.${ext}`);

      statusLine.hidden = false;
      if (gaveUp) {
        statusLine.textContent = `Even heavy JPEG compression couldn't get under ${formatBytes(maxBytes)} — saved the smallest possible version at ${formatBytes(blob.size)} instead.`;
      } else if (method === "resized-lossless") {
        const pct = Math.round(scale * 100);
        statusLine.textContent = `Saved at ${formatBytes(blob.size)} — resized to ${pct}% to fit under ${formatBytes(maxBytes)}. Still a lossless PNG, so no compression artifacts, just fewer pixels.`;
      } else if (method === "jpeg-fallback") {
        statusLine.textContent = `Saved at ${formatBytes(blob.size)} — even resized, a lossless PNG couldn't fit under ${formatBytes(maxBytes)}, so this was converted to JPEG at the highest quality that still fits. Some quality loss is unavoidable at this size.`;
      } else {
        statusLine.textContent = `Saved at ${formatBytes(blob.size)}.`;
      }
    } finally {
      downloadBtn.disabled = false;
      downloadBtn.textContent = originalLabel;
    }
  });

  resetBtn.addEventListener("click", () => {
    currentImage = null;
    fileInput.value = "";
    editor.hidden = true;
    dropZone.hidden = false;
    dropZone.scrollIntoView({ behavior: "smooth", block: "start" });
  });
})();
  </script>
</body>
</html>
